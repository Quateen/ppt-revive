services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ppt_revive
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;user=root;password=${MYSQL_ROOT_PASSWORD};database=ppt_revive;Connection Timeout=60;Allow User Variables=True;"
      Jwt__AdminSecretKey: ${JWT_ADMIN_SECRET_KEY}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Claude__ApiKey: ${CLAUDE_API_KEY}
      Claude__Model: ${CLAUDE_MODEL:-claude-opus-4-8}
      PubMed__ApiKey: ${PUBMED_API_KEY}
      Processing__FreeTierSlides: ${FREE_TIER_SLIDES:-5}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__UseSSL: ${SMTP_USESSL:-true}
      GoogleAuth__ClientId: ${GOOGLE_OAUTH_CLIENT_ID:-}
      Cors__AllowedOrigins__0: https://${APP_DOMAIN}
      AppConfig__FEBaseURL: https://${APP_DOMAIN}
    volumes:
      # Uploaded and finalized decks survive container restarts. These live outside
      # wwwroot so they are never served as static files.
      - ppt_files:/app/ppt-storage

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://${API_DOMAIN}
        VITE_GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
        VITE_FREE_TIER_SLIDES: ${FREE_TIER_SLIDES:-5}
        VITE_FOUNDING_URL: ${FOUNDING_URL:-https://nucleusdigitalis.com}
        VITE_PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
  ppt_files:
  caddy_data:
  caddy_config:
